<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Llama between angle brackets">
  <title>Llama between angle brackets</title>
  <desc>A compact llama icon centered between left and right angle brackets.</desc>
  <style>
    :root {
      --icon-accent: #60a5fa;
      --icon-body: #f3f4f7;
      --icon-detail: #0c0c0f;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --icon-accent: #2563eb;
        --icon-body: #101116;
        --icon-detail: #f4f4f2;
      }
    }

    .accent-stroke {
      stroke: var(--icon-accent);
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 4;
    }

    .llama-body {
      fill: var(--icon-body);
    }

    .llama-detail {
      fill: var(--icon-detail);
    }
  </style>

  <path class="accent-stroke" d="M19 14 L8 32 L19 50" />
  <path class="accent-stroke" d="M45 14 L56 32 L45 50" />

  <g transform="translate(0 1)">
    <rect class="llama-body" x="23" y="28" width="16" height="12" rx="5" />
    <rect class="llama-body" x="34" y="16" width="5" height="16" rx="2.5" />
    <ellipse class="llama-body" cx="41" cy="16" rx="5" ry="4" />
    <path class="llama-body" d="M37 13 L38.5 8 L40.5 13 Z" />
    <path class="llama-body" d="M40 13 L42 8 L44 13 Z" />
    <rect class="llama-body" x="25" y="39" width="3" height="10" rx="1.5" />
    <rect class="llama-body" x="30" y="39" width="3" height="10" rx="1.5" />
    <rect class="llama-body" x="35" y="39" width="3" height="10" rx="1.5" />
    <rect class="llama-body" x="22" y="30" width="3" height="8" rx="1.5" transform="rotate(-22 23.5 34)" />
    <circle class="llama-detail" cx="42.5" cy="16" r="0.8" />
  </g>
</svg>
