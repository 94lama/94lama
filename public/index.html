<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; url=/en" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Redirecting…</title>
    <script>
      // Fallback JS redirect for clients where meta-refresh isn't enough
      (function(){ if (location.pathname !== '/en') location.replace('/en'); })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/en">/en</a>…</p>
  </body>
</html>
