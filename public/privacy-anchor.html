<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Privacy Anchor (Standalone)</title>
    <style>
      body { font-family: system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial; padding: 2rem; background: #fff; color: #111; }
      .container { max-width: 780px; margin: 0 auto; }
      .notice { background: #f8f9fa; border: 1px solid #e9ecef; padding: 1rem; border-radius: 6px; margin-bottom: 1rem; }
      .anchor-box { padding: 1rem; border: 1px dashed #ddd; border-radius: 6px; min-height: 4rem; }
      .hint { font-size: 0.9rem; color: #6b7280; margin-top: 0.75rem; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Privacy Anchor (Standalone)</h1>
      <p class="notice">Paste your Iubenda anchor snippet (an <code>&lt;a&gt;</code> tag) into the box below, then save the file and open this page to test.</p>

      <div id="privacy-anchor" class="anchor-box">
        <!-- Paste your privacy anchor snippet here. Example:
             <a href="https://www.iubenda.com/privacy-policy/XXXXX" target="_blank" rel="noopener noreferrer">Privacy Policy</a>
        -->
      </div>

      <p class="hint">If your snippet relies on Iubenda scripts, ensure the Iubenda script is loaded globally (app/head.tsx) or paste the script tag into this file as well.</p>
    </div>
  </body>
</html>
